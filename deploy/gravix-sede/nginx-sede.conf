# Web local del Gravix de sede: sirve la app y pasa /api y /ws a la API de la sede, asi la
# misma imagen funciona con cualquier IP de VM.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: con la direccion en una variable, nginx vuelve a resolver "gravix"
  # cuando ese contenedor se recrea (actualizacion). Sin esto queda con la IP vieja y da 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gravix http://gravix:3000;

  location /api/ {
    proxy_pass $gravix;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 20m;
  }

  location /ws {
    proxy_pass $gravix;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
