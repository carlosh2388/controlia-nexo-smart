# Telegraf del Gravix de sede: registra cada 10 s el consumo de los contenedores (memoria, CPU, disco,
# red) y cada 5 min el tamano de TimescaleDB y de InfluxDB, en el bucket "monitoreo" del InfluxDB de
# la sede (30 dias). Se ve en la web de InfluxDB -> Dashboards -> "Consumo Gravix de sede".
# Solo lee: el socket de Docker va montado en solo lectura y a Postgres entra con su usuario.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "monitoreo"

# Memoria, CPU, red y disco de cada contenedor de este compose.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["gravix-sede*"]
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["com.docker.compose.service"]

# Tamano de TimescaleDB (total, lecturas de energia, historial de sensores) y estado de su cache.
[[inputs.postgresql_extensible]]
  interval = "5m"
  address = "host=db user=gravix password=${DB_PASSWORD} dbname=gravix sslmode=disable"
  [[inputs.postgresql_extensible.query]]
    measurement = "timescaledb"
    sqlquery = "SELECT pg_database_size('gravix') AS base_bytes, hypertable_size('readings') AS readings_bytes, pg_total_relation_size('device_readings') AS sensores_bytes, (SELECT count(*) FROM timescaledb_information.chunks WHERE hypertable_name='readings' AND is_compressed) AS chunks_comprimidos, (SELECT count(*) FROM pg_stat_activity WHERE datname='gravix') AS conexiones, (SELECT round(100.0*sum(blks_hit)/nullif(sum(blks_hit)+sum(blks_read),0),2) FROM pg_stat_database WHERE datname='gravix') AS cache_hit_pct"
    withdbname = false

# Tamano en disco y memoria del propio InfluxDB (sus metricas internas).
[[inputs.prometheus]]
  interval = "5m"
  urls = ["http://influxdb:8086/metrics"]
  metric_version = 2
  name_override = "influxdb_interno"
  fieldinclude = ["storage_shard_disk_size", "storage_cache_inuse_bytes", "go_memstats_alloc_bytes", "go_memstats_sys_bytes"]
