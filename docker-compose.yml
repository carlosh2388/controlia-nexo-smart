services:
  postgres:
    # PostgreSQL 16 + TimescaleDB (ver docker/postgres/Dockerfile). Usa el mismo volumen que la
    # imagen postgres:16 anterior: misma version mayor y misma base Debian.
    build: docker/postgres
    image: siasa-postgres-timescale:16.15-2.31.0
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: siasa
      POSTGRES_PASSWORD: siasa
      POSTGRES_DB: siasa_iot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://siasa:siasa@postgres:5432/siasa_iot?schema=public
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      LORAWAN_MQTT_URL: ${LORAWAN_MQTT_URL:-}
      LORAWAN_MQTT_USERNAME: ${LORAWAN_MQTT_USERNAME:-}
      LORAWAN_MQTT_PASSWORD: ${LORAWAN_MQTT_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AREA_UPLOADS_DIR: /app/uploads/areas
      # Puente BACnet/IP (apps/bacnet-bridge): corre en el host, fuera de Docker, porque Docker
      # Desktop en Windows no puede enrutar UDP/47808 hacia la LAN real del edificio.
      BACNET_BRIDGE_URL: ${BACNET_BRIDGE_URL:-http://host.docker.internal:3099}
      BACNET_BRIDGE_TOKEN: ${BACNET_BRIDGE_TOKEN:-}
      # Centro de mando: lee el monitoreo central (10.30.10.27) y, para las alarmas/correos de cada
      # equipo, la API de cada sede. Clave y API keys solo en el servidor (.env y config/centro/).
      CENTRAL_URL: ${CENTRAL_URL:-}
      CENTRAL_CLAVE: ${CENTRAL_CLAVE:-}
      CENTRAL_SEDES_FILE: /app/config/centro/sedes.json
      # Gravix IA (opcional, de pago por uso): preguntas libres de solo lectura con la API de Claude.
      # Vacio = Gravix solo con su analitica propia. La clave va solo en el .env del servidor.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # IA local (Ollama en la red, sin licencia): si OLLAMA_URL tiene valor, Gravix usa este modelo.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen3.5:4b}
      ASISTENTE_PROVEEDOR: ${ASISTENTE_PROVEEDOR:-}
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-claude-opus-5-5}
      ASISTENTE_ESFUERZO: ${ASISTENTE_ESFUERZO:-medium}
    ports:
      - "3010:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - area_uploads:/app/uploads
      - ./config/centro:/app/config/centro:ro
    depends_on:
      - postgres
      - redis
      - mosquitto

  # Agente Go de TEC 3 (opcional: COMPOSE_PROFILES=agente-tec3). Lee y controla los equipos que en
  # Equipos > "Equipos que maneja" se le pasan (Home Assistant, MQTT, LoRaWAN, aires BACnet), en lugar
  # de la API. Si se cae, la API retoma esos equipos sola. Ver docs/agente-tec3.md.
  agente-tec3:
    profiles: ["agente-tec3"]
    build: ./apps/Agente_Go
    image: nodivo-agente:${AGENTE_VERSION:-0.6.0}
    restart: unless-stopped
    environment:
      AGENT_BUILDING_KEY: ${AGENTE_TEC3_KEY:-tec3}
      AGENT_API_KEY: ${AGENTE_TEC3_API_KEY:-}
      AGENT_API_URL: http://api:3000/api/v1
      AGENT_SYNC_SECONDS: 15
      AGENT_REMOTE_CONFIG: "false"
      AGENT_EVENTS: "false"
      AGENT_GESTION: "true"
      AGENT_GESTION_MQTT_URL: tcp://mosquitto:1883
      AGENT_GESTION_LORAWAN_URL: ${AGENTE_TEC3_LORAWAN_URL:-}
      AGENT_GESTION_LORAWAN_USER: ${LORAWAN_MQTT_USERNAME:-}
      AGENT_GESTION_LORAWAN_PASS: ${LORAWAN_MQTT_PASSWORD:-}
      AGENT_GESTION_BACNET_URL: ${BACNET_BRIDGE_URL:-http://host.docker.internal:3099}
      AGENT_GESTION_BACNET_TOKEN: ${BACNET_BRIDGE_TOKEN:-}
      AGENT_GESTION_HOSTS: ${AGENTE_TEC3_HOSTS:-}
      TZ: America/Guatemala
    volumes:
      - agente_tec3_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }
    depends_on:
      - api
      - mosquitto

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3010/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3010/ws}
    restart: unless-stopped
    environment:
      # HTTPS en el puerto 5443 si hay certificado en config/web-tls (web.crt + web.key, fuera de git).
      # Hace falta para el microfono del asistente Gravix (el navegador lo bloquea en HTTP).
      WEB_HTTPS: ${WEB_HTTPS:-1}
      # Con HTTPS activo, la direccion http (5173) manda a la https; 0 = dejar http abierto.
      WEB_HTTP_REDIRECT: ${WEB_HTTP_REDIRECT:-1}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-5443}
    ports:
      - "5173:80"
      - "${WEB_HTTPS_PORT:-5443}:443"
    volumes:
      - ./config/web-tls:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
  area_uploads:
  agente_tec3_data:
